<!DOCTYPE html>
<html>
<head link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <title>StuBud</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            height: 100vh;

            background: url("/static/bg.jpg") center/cover no-repeat;

            display: flex;
            flex-direction: column;
        }

        /* DARK BLUR OVERLAY */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            backdrop-filter: blur(8px);
            background: rgba(2, 6, 23, 0.45);
            z-index: -1;
        }

        /* MAIN CONTAINER */
        .container {
            width: 95%;
            max-width: 900px;
            height: 90vh;
            margin: auto;
            position: relative;

            display: flex;
            flex-direction: column;
            outline: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            overflow: hidden;

            background: rgba(42, 49, 62, 0.606);
            backdrop-filter: blur(18px);

            border: 2px solid rgba(0, 0, 0, 0.784); /* FIXED */

            box-shadow:
                0 20px 60px rgba(0,0,0,0.7),
                inset 0 1px 0 rgba(255,255,255,0.05);
        }

        /* HEADER */
        .header {
            padding: 18px 22px;
            color: #e5e7eb;
            font-size: 16px;
            font-family:Verdana, Geneva, Tahoma, sans-serif ;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .header span {
            float: right;
            cursor: pointer;
            opacity: 0.6;
        }

        .header span:hover {
            opacity: 1;
        }

        /* CHAT AREA */
        .chat-box {
            flex: 1;
            padding: 22px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

    

        /* MESSAGE */
        .msg {
            display: flex;
            flex-direction: column;
        }

        .user { align-items: flex-end; }
        .bot { align-items: flex-start; }

        /* BUBBLE */
        .bubble {
            max-width: 70%;
            padding: 14px 16px;
            border-radius: 16px;
            line-height: 1.7;
            font-size: 14px;
            white-space: pre-line;

            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* USER (slightly darker) */
        .user .bubble {
            background: rgba(255,255,255,0.06);
            color: #e5e7eb;
        }

        /* BOT (slightly lighter) */
        .bot .bubble {
            background: rgba(255,255,255,0.10);
            color: #f1f5f9;
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* COPY */
        .actions {
            font-size: 11px;
            color: #64748b;
            margin-top: 5px;
            cursor: pointer;
        }

        /* INPUT */
        .input-area {
            padding: 14px;
            display: flex;
            gap: 10px;

            background: rgba(2,6,23,0.7);
            backdrop-filter: blur(20px);

            border-top: 1px solid rgba(255,255,255,0.05);
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);

            background: rgba(255,255,255,0.04);
            color: #e5e7eb;
        }

        button {
            padding: 0 18px;
            border-radius: 12px;
            border: none;

            background: rgba(255,255,255,0.1);
            color: #e5e7eb;

            transition: 0.2s ease;
        }

        button:hover {
            background: rgba(255,255,255,0.2);
        }

        /* MODAL */
        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);

            justify-content: center;
            align-items: center;
        }

        .modal-box {
            width: 260px;
            padding: 20px;
            border-radius: 16px;

            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);

            border: 1px solid rgba(255,255,255,0.1);
            color: #e5e7eb;
            text-align: center;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-actions button {
            flex: 1;
        }
        
        .close-btn {
            position: absolute;
            top: 10px;
            right: 14px;

            font-size: 14px;
            color: #94a3b8;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #e5e7eb;
        }
        .topbar {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 24px;
        }
        .brand-title {
            font-size: 18px;
            font-weight: 600;
            color: #f1f5f9;
        }

        .brand-sub {
            font-size: 12px;
            color: #94a3b8;
        }
        .main {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
<div class="topbar">
    <div class="brand">
        <div class="brand-title">StuBud</div>
        <div class="brand-sub">Mentor</div>
    </div>
</div>

<!-- MAIN CENTER -->
<div class="main">

    <div class="container">

        <!-- CLEAR CHAT BUTTON -->
        <div class="close-btn" onclick="openModal()">✕</div>

        <!-- CHAT -->
        <div id="chat-box" class="chat-box"></div>

        <!-- INPUT -->
        <div class="input-area">
            <input id="message" placeholder="Type your message..." />
            <button onclick="sendMessage()">Send</button>
        </div>

    </div>

</div>

<!-- MODAL (KEEP) -->
<div id="modal">
    <div class="modal-box">
        <p>Clear chat?</p>
        <div class="modal-actions">
            <button onclick="clearChat()">Clear</button>
            <button onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<script>
function addMessage(text, type) {
    let chatBox = document.getElementById("chat-box");

    let msgDiv = document.createElement("div");
    msgDiv.className = "msg " + type;

    let bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerText = text;

    let actions = document.createElement("div");
    actions.className = "actions";
    actions.innerText = "Copy";

    actions.onclick = () => {
        navigator.clipboard.writeText(text);
        actions.innerText = "Copied!";
        setTimeout(() => actions.innerText = "Copy", 1500);
    };

    msgDiv.appendChild(bubble);
    msgDiv.appendChild(actions);

    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage() {
    let input = document.getElementById("message");
    let msg = input.value.trim();
    if (!msg) return;

    addMessage(msg, "user");
    input.value = "";

    let response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg })
    });

    let data = await response.json();
    addMessage(data.reply, "bot");
}

document.getElementById("message").addEventListener("keydown", function(e) {
    if (e.key === "Enter") sendMessage();
});

function openModal() {
    document.getElementById("modal").style.display = "flex";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

function clearChat() {
    document.getElementById("chat-box").innerHTML = "";
    closeModal();
}
</script>

</body>
</html>
